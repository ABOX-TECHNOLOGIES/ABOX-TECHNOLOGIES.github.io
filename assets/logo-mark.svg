<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ABOX Technologies mark">
  <title>ABOX Technologies</title>
  <desc>An open box releasing a glowing network of connected nodes and circuit traces.</desc>
  <defs>
    <linearGradient id="abx-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="abx-lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="abx-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="abx-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="abx-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- light escaping from the box -->
  <ellipse cx="92" cy="62" rx="62" ry="54" fill="url(#abx-glow)" opacity="0.9"/>

  <!-- box body -->
  <polygon points="48,90 100,120 100,180 48,150" fill="url(#abx-face)"/>
  <polygon points="100,120 152,90 152,150 100,180" fill="url(#abx-face)"/>

  <!-- opening (interior) -->
  <polygon points="48,90 100,60 152,90 100,120" fill="#040711"/>
  <polygon points="48,90 100,60 152,90 100,120" fill="url(#abx-glow)"/>
  <polygon points="48,90 100,60 152,90 100,120" fill="#22D3EE" opacity="0.35" filter="url(#abx-blur)"/>

  <!-- box edges -->
  <g stroke="url(#abx-edge)" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <polygon points="48,90 100,120 100,180 48,150"/>
    <polygon points="100,120 152,90 152,150 100,180"/>
    <polyline points="48,90 100,60 152,90"/>
  </g>

  <!-- the network escaping -->
  <g class="abx-net" stroke="url(#abx-edge)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 88 L96 46"/>
    <path d="M96 46 L68 30 L44 44"/>
    <path d="M96 46 L112 20 L86 10"/>
    <path d="M68 30 L62 12"/>
    <path d="M112 20 L134 10"/>
    <path d="M100 88 V74 H80 V60"/>
  </g>
  <g class="abx-nodes" fill="#E0F2FE">
    <circle cx="96" cy="46" r="4.2"/>
    <circle cx="68" cy="30" r="3.2"/>
    <circle cx="112" cy="20" r="3.4"/>
    <circle cx="44" cy="44" r="2.6"/>
    <circle cx="86" cy="10" r="2.2"/>
    <circle cx="62" cy="12" r="1.8"/>
    <circle cx="134" cy="10" r="2.4"/>
    <circle cx="80" cy="60" r="2.2"/>
  </g>
  <g class="abx-dust" fill="#A5F3FC">
    <circle cx="30" cy="30" r="1.3"/>
    <circle cx="52" cy="60" r="1"/>
    <circle cx="104" cy="4" r="1.2"/>
    <circle cx="36" cy="72" r="0.9"/>
    <circle cx="150" cy="6" r="0.9"/>
  </g>

  <!-- open lid -->
  <polygon points="100,60 152,90 176,44 124,14" fill="url(#abx-lid)" stroke="url(#abx-edge)" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
